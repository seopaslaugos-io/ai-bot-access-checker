<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Store screenshot frame</title>
<!-- 1280x800 store screenshot: the real popup (live API call) next to a short caption.
     Open as store/frame.html?url=https://example.com/&caption=... from a local server at extension/. -->
<style>
  html, body { margin: 0; width: 1280px; height: 800px; overflow: hidden; }
  body {
    display: flex; align-items: center; justify-content: center; gap: 72px;
    background: linear-gradient(135deg, #eceff5 0%, #e9ecf8 100%);
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    color: #080b12;
  }
  .copy { width: 520px; }
  .copy img { width: 56px; height: 56px; border-radius: 14px; }
  .copy h1 { margin: 22px 0 14px; font-size: 44px; line-height: 1.12; letter-spacing: -0.02em; }
  .copy p { margin: 0; font-size: 20px; line-height: 1.5; color: #3c4657; }
  .copy .url { margin-top: 22px; font-size: 16px; color: #6d7889; }
  .shot {
    width: 456px; height: 720px; border-radius: 14px; overflow: hidden; background: #fff;
    box-shadow: 0 24px 60px rgba(15, 26, 63, .18), 0 2px 6px rgba(15, 26, 63, .08);
    border: 1px solid #dde3ec;
  }
  iframe { width: 380px; height: 600px; border: 0; transform: scale(1.2); transform-origin: 0 0; }
</style>
</head>
<body>
  <div class="copy">
    <img src="../icons/icon-128.png" alt="">
    <h1 id="caption">Can AI crawlers reach this page?</h1>
    <p id="sub">One click checks 13 AI and search bots against robots.txt and the server's real answer.</p>
    <p class="url" id="url"></p>
  </div>
  <div class="shot"><iframe id="popup" title="Popup"></iframe></div>
<script>
  const q = new URLSearchParams(location.search);
  const url = q.get('url') || 'https://seopaslaugos.io/';
  if (q.get('caption')) document.getElementById('caption').textContent = q.get('caption');
  if (q.get('sub')) document.getElementById('sub').textContent = q.get('sub');
  document.getElementById('url').textContent = 'Live check of ' + url;
  document.getElementById('popup').src = '../popup.html?run=1&url=' + encodeURIComponent(url);
</script>
</body>
</html>
